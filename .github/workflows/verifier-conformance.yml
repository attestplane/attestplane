name: verifier-conformance

on:
  push:
    branches: [main]
    paths:
      - "sdk/python/**"
      - "sdk/typescript/**"
      - ".github/workflows/verifier-conformance.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdk/python/**"
      - "sdk/typescript/**"
      - ".github/workflows/verifier-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifier-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python-and-typescript:
    name: Python and TypeScript verifier conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: sdk/python/pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Python verifier conformance
        working-directory: sdk/python
        run: |
          uv venv --python 3.12 .venv
          uv pip install -e '.[dev]'
          .venv/bin/pytest tests/conformance/test_verifier_conformance.py -q

      - name: TypeScript verifier conformance
        working-directory: sdk/typescript
        run: |
          npm ci
          npm test -- --run test/verifier_conformance.test.ts
